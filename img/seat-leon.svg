<svg viewBox="0 0 480 175" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2e2e2e"/>
      <stop offset="45%"  stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7ab0d0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1c3a58" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="wheel" cx="38%" cy="32%" r="62%">
      <stop offset="0%"   stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.00)"/>
      <stop offset="40%"  stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.00)"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="240" cy="168" rx="208" ry="7" fill="rgba(0,0,0,0.18)"/>

  <!-- ── MAIN BODY ── -->
  <path fill="url(#body)" d="
    M 32,112
    C 24,108 18,100 18,88
    C 18,76 24,65 40,55
    L 75,42
    L 142,24
    L 165,18
    C 183,14 215,12 255,12
    L 328,12
    C 362,12 390,22 408,46
    C 422,64 432,90 434,112
    L 32,112 Z
  "/>

  <!-- Body top shine -->
  <path fill="url(#shine)" d="
    M 165,18 C 215,12 300,12 328,12
    C 362,12 388,22 406,44
    C 388,22 360,14 328,14
    L 255,14 C 215,14 183,16 165,20 Z
  "/>

  <!-- Front wheel arch -->
  <circle cx="112" cy="116" r="38" fill="white"/>
  <!-- Rear wheel arch -->
  <circle cx="350" cy="116" r="38" fill="white"/>

  <!-- ── WINDOWS ── -->

  <!-- Windshield -->
  <path fill="url(#glass)" d="
    M 153,22  L 142,58  L 218,58  L 222,20 Z
  "/>
  <!-- Front door window -->
  <path fill="url(#glass)" d="
    M 225,18  L 222,58  L 286,58  L 288,18 Z
  "/>
  <!-- Rear door window -->
  <path fill="url(#glass)" d="
    M 292,16  L 291,58  L 358,63
    C 376,54 396,38 408,20
    L 355,13 Z
  "/>

  <!-- Window pillars -->
  <rect fill="#111" x="149" y="18"  width="7" height="42" rx="2"/>
  <rect fill="#111" x="221" y="16"  width="7" height="44" rx="2"/>
  <rect fill="#111" x="288" y="14"  width="7" height="47" rx="2"/>

  <!-- ── WHEELS ── -->

  <!-- Front wheel -->
  <circle cx="112" cy="136" r="34" fill="url(#wheel)" stroke="#1e1e1e" stroke-width="2"/>
  <circle cx="112" cy="136" r="22" fill="#111"/>
  <circle cx="112" cy="136" r="8"  fill="#1e1e1e"/>
  <g stroke="#2a2a2a" stroke-width="3.5" stroke-linecap="round">
    <line x1="112" y1="116" x2="112" y2="128"/>
    <line x1="112" y1="144" x2="112" y2="156"/>
    <line x1="92"  y1="136" x2="104" y2="136"/>
    <line x1="120" y1="136" x2="132" y2="136"/>
    <line x1="98"  y1="122" x2="106" y2="130"/>
    <line x1="118" y1="142" x2="126" y2="150"/>
    <line x1="126" y1="122" x2="118" y2="130"/>
    <line x1="106" y1="142" x2="98"  y2="150"/>
  </g>

  <!-- Rear wheel -->
  <circle cx="350" cy="136" r="34" fill="url(#wheel)" stroke="#1e1e1e" stroke-width="2"/>
  <circle cx="350" cy="136" r="22" fill="#111"/>
  <circle cx="350" cy="136" r="8"  fill="#1e1e1e"/>
  <g stroke="#2a2a2a" stroke-width="3.5" stroke-linecap="round">
    <line x1="350" y1="116" x2="350" y2="128"/>
    <line x1="350" y1="144" x2="350" y2="156"/>
    <line x1="330" y1="136" x2="342" y2="136"/>
    <line x1="358" y1="136" x2="370" y2="136"/>
    <line x1="336" y1="122" x2="344" y2="130"/>
    <line x1="356" y1="142" x2="364" y2="150"/>
    <line x1="364" y1="122" x2="356" y2="130"/>
    <line x1="344" y1="142" x2="336" y2="150"/>
  </g>

  <!-- ── FRONT DETAILS ── -->

  <!-- Headlight housing -->
  <path fill="#0d0d0d" d="M 20,66 L 40,55 L 62,48 L 62,70 L 32,72 Z"/>
  <!-- Headlight (amber/white) -->
  <path fill="rgba(255,235,100,0.88)" d="M 22,68 L 38,58 L 58,52 L 58,68 Z"/>
  <!-- DRL strip -->
  <line x1="26" y1="62" x2="56" y2="62" stroke="rgba(255,255,210,0.75)" stroke-width="3" stroke-linecap="round"/>

  <!-- Front grille -->
  <path fill="#0a0a0a" d="M 18,88 C 18,96 20,108 24,112 L 40,112 L 40,86 Z"/>
  <line x1="20" y1="92" x2="39" y2="92" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="19" y1="98" x2="39" y2="98" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="19" y1="104" x2="39" y2="104" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Front fog light -->
  <rect fill="rgba(255,240,120,0.45)" x="22" y="106" width="12" height="5" rx="2"/>

  <!-- SEAT badge (front) -->
  <circle cx="31" cy="80" r="6" fill="none" stroke="#555" stroke-width="1.5"/>
  <text x="31" y="83.5" text-anchor="middle" font-size="7" font-family="Arial,sans-serif" font-weight="900" fill="#666">S</text>

  <!-- ── REAR DETAILS ── -->

  <!-- Taillight housing -->
  <path fill="#0a0a0a" d="M 432,86 L 434,112 L 448,112 L 448,78 Z"/>
  <!-- Taillight (red) -->
  <path fill="rgba(200,15,15,0.95)" d="M 434,88 L 434,110 L 445,110 L 445,80 Z"/>
  <!-- Rear light strip along hatch -->
  <path fill="rgba(180,10,10,0.55)" d="M 410,48 L 432,86 L 428,88 L 406,50 Z"/>

  <!-- Rear fog + reverse -->
  <rect fill="rgba(200,15,15,0.4)"  x="434" y="107" width="8" height="4" rx="1"/>

  <!-- ── BODY DETAILS ── -->

  <!-- Character / shoulder line -->
  <path fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2.5"
    d="M 62,72 Q 220,62 392,68 L 430,82"/>

  <!-- Lower sill trim -->
  <rect fill="#0e0e0e" x="58" y="109" width="374" height="5" rx="1"/>

  <!-- Door handles -->
  <rect fill="#252525" x="195" y="85" width="18" height="5" rx="2.5" stroke="#1a1a1a" stroke-width="0.5"/>
  <rect fill="#252525" x="308" y="85" width="18" height="5" rx="2.5" stroke="#1a1a1a" stroke-width="0.5"/>

  <!-- Wing mirror -->
  <path fill="#0d0d0d" d="M 160,60 L 148,56 L 147,65 L 160,65 Z" stroke="#1a1a1a" stroke-width="0.5"/>
</svg>
